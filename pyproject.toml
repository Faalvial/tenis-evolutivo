# Configuración de pytest. Gracias a "pythonpath", las pruebas de tests/
# pueden hacer "import config" o "import grabar" como si estuvieran en la raíz.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# pygame usa por dentro una función vieja de setuptools y avisa en cada
# prueba del visor; no es un problema nuestro, así que se oculta ese aviso.
filterwarnings = ["ignore:pkg_resources is deprecated:DeprecationWarning"]
